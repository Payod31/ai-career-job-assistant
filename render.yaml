# Render deployment for the Career AI assistant (Flask backend + static frontend).
#
# GEMINI_API_KEY is deliberately NOT in this file. Add it privately in the
# Render dashboard (Environment settings) so the key never lives in Git.
# The OpenAI API key is not used by this deployment and must NOT be added
# to Render's environment.

services:
  - type: web
    name: ai-career-job-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 100: a Gemini request can take up to ai_client.REQUEST_TIMEOUT
    # (90s). Gunicorn's default 30s worker timeout kills in-flight workers, so
    # a slow-but-healthy AI call would die mid-request and surface as a 502
    # Bad Gateway from Render's router. 100s > 90s cap, so a request that
    # outlives this gets the clean JSON timeout error instead.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 100 server:app
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # GEMINI_API_KEY must be entered privately in Render's environment
      # settings (do not commit it).
